<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <title>Editar Produto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="cadastro.html">Produtos</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="cadastro.html">Cadastrar</a></li>
                <li class="nav-item"><a class="nav-link" href="listar.html">Listar</a></li>
                <li class="nav-item"><a class="nav-link active" href="editar.html">Editar</a></li>
                <li class="nav-item"><a class="nav-link" href="remover.html">Remover</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow-sm">
                <div class="card-header">
                    <h5 class="mb-0">Editar Produto</h5>
                </div>
                <div class="card-body">

                    <div class="mb-3">
                        <label for="codigo" class="form-label">Código do produto</label>
                        <input type="number" id="codigo" class="form-control" placeholder="Informe o código existente">
                        <div class="form-text">Use o código exibido na tela de listagem.</div>
                    </div>

                    <div class="mb-3">
                        <label for="nome" class="form-label">Novo nome</label>
                        <input type="text" id="nome" class="form-control" placeholder="Ex.: Notebook Gamer">
                    </div>

                    <div class="mb-3">
                        <label for="marca" class="form-label">Nova marca</label>
                        <input type="text" id="marca" class="form-control" placeholder="Ex.: Acer">
                    </div>

                    <button id="btnEditar" class="btn btn-warning w-100 text-white">Salvar Alterações</button>

                    <div id="mensagem" class="mt-3"></div>

                </div>
            </div>

        </div>
    </div>
</div>

<script>
    document.getElementById('btnEditar').addEventListener('click', async () => {
        const codigo = document.getElementById('codigo').value.trim();
        const nome = document.getElementById('nome').value.trim();
        const marca = document.getElementById('marca').value.trim();
        const mensagemDiv = document.getElementById('mensagem');

        mensagemDiv.textContent = '';
        mensagemDiv.className = '';

        if (!codigo || !nome || !marca) {
            mensagemDiv.textContent = 'Preencha código, nome e marca.';
            mensagemDiv.className = 'alert alert-danger';
            return;
        }

        const codigoNum = parseInt(codigo, 10);
        if (isNaN(codigoNum) || codigoNum <= 0) {
            mensagemDiv.textContent = 'Código inválido.';
            mensagemDiv.className = 'alert alert-danger';
            return;
        }

        try {
            const response = await fetch('/alterar', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    codigo: codigoNum,
                    nome: nome,
                    marca: marca
                })
            });

            const data = await response.json();

            if (!response.ok) {
                mensagemDiv.textContent = data.mensagem || 'Erro ao alterar produto.';
                mensagemDiv.className = 'alert alert-danger';
            } else {
                mensagemDiv.textContent = 'Produto alterado com sucesso!';
                mensagemDiv.className = 'alert alert-success';
                // Se quiser, limpar campos:
                // document.getElementById('codigo').value = '';
                // document.getElementById('nome').value = '';
                // document.getElementById('marca').value = '';
            }
        } catch (erro) {
            console.error(erro);
            mensagemDiv.textContent = 'Erro ao conectar com o servidor.';
            mensagemDiv.className = 'alert alert-danger';
        }
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
