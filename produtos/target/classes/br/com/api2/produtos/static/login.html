<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center" style="height: 100vh;">
    <div class="col-md-4">

        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white text-center">
                <h5 class="mb-0">Login do Sistema</h5>
            </div>

            <div class="card-body">

                <div class="mb-3">
                    <label class="form-label">Usuário</label>
                    <input type="text" id="usuario" class="form-control" placeholder="Digite o usuário">
                </div>

                <div class="mb-3">
                    <label class="form-label">Senha</label>
                    <input type="password" id="senha" class="form-control" placeholder="Digite a senha">
                </div>

                <button class="btn btn-primary w-100" id="btnLogin">Entrar</button>

                <div id="mensagem" class="mt-3"></div>

            </div>
        </div>

    </div>
</div>

<script>
    document.getElementById('btnLogin').addEventListener('click', async () => {

        const usuario = document.getElementById('usuario').value.trim();
        const senha = document.getElementById('senha').value.trim();
        const mensagemDiv = document.getElementById('mensagem');

        mensagemDiv.textContent = '';
        mensagemDiv.className = '';

        if (!usuario || !senha) {
            mensagemDiv.textContent = 'Preencha usuário e senha.';
            mensagemDiv.className = 'alert alert-danger';
            return;
        }

        try {
            const response = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ usuario, senha })
            });

            const data = await response.json();

            if (!response.ok) {
                mensagemDiv.textContent = data.mensagem;
                mensagemDiv.className = 'alert alert-danger';
            } else {
                // Login OK → redirecionar
                mensagemDiv.textContent = 'Login realizado com sucesso!';
                mensagemDiv.className = 'alert alert-success';

                setTimeout(() => {
                    window.location.href = "cadastro.html";
                }, 800);
            }

        } catch (error) {
            mensagemDiv.textContent = 'Erro ao conectar com o servidor.';
            mensagemDiv.className = 'alert alert-danger';
        }
    });
</script>

</body>
</html>
