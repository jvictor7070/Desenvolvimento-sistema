<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <title>Remover Produto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="cadastro.html">Produtos</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="cadastro.html">Cadastrar</a></li>
                <li class="nav-item"><a class="nav-link" href="listar.html">Listar</a></li>
                <li class="nav-item"><a class="nav-link" href="editar.html">Editar</a></li>
                <li class="nav-item"><a class="nav-link active" href="remover.html">Remover</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow-sm">
                <div class="card-header">
                    <h5 class="mb-0">Remover Produto</h5>
                </div>
                <div class="card-body">

                    <div class="mb-3">
                        <label for="codigo" class="form-label">Código do produto</label>
                        <input type="number" id="codigo" class="form-control" placeholder="Ex.: 1">
                    </div>

                    <button id="btnRemover" class="btn btn-danger w-100">Remover</button>

                    <div id="mensagem" class="mt-3"></div>

                </div>
            </div>

        </div>
    </div>
</div>

<script>
    document.getElementById('btnRemover').addEventListener('click', async () => {
        const codigo = document.getElementById('codigo').value.trim();
        const mensagemDiv = document.getElementById('mensagem');

        mensagemDiv.textContent = '';
        mensagemDiv.className = '';

        if (!codigo) {
            mensagemDiv.textContent = 'Informe o código do produto.';
            mensagemDiv.className = 'alert alert-danger';
            return;
        }

        try {
            const response = await fetch(`/remover/${codigo}`, { method: 'DELETE' });
            const data = await response.json().catch(() => null);

            if (!response.ok) {
                mensagemDiv.textContent = (data && data.mensagem) || 'Erro ao remover o produto.';
                mensagemDiv.className = 'alert alert-danger';
            } else {
                mensagemDiv.textContent = (data && data.mensagem) || 'Produto removido com sucesso.';
                mensagemDiv.className = 'alert alert-success';
                document.getElementById('codigo').value = '';
            }
        } catch (erro) {
            console.error(erro);
            mensagemDiv.textContent = 'Erro ao conectar com o servidor.';
            mensagemDiv.className = 'alert alert-danger';
        }
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
